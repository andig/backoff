name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test the minimum version declared in go.mod and the latest release.
        go-version: [ '1.23', 'stable' ]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -race -cover -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: gofmt
      run: |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "These files are not gofmt-ed:"
          echo "$files"
          exit 1
        fi

    - name: go vet
      run: go vet ./...
